stages:
  - validate
  - test

default:
  tags:
    - homelab
    - docker

validate-python:
  stage: validate
  image: python:3.12-slim

  script:
    - echo "Validating Python application"
    - python --version
    - python -m compileall app

unit-tests:
  stage: test
  image: python:3.12-slim

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r app/requirements.txt
    - pip install pytest

  script:
    - python -m pytest -v
