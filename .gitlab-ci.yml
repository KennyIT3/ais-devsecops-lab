stages:
  - validate
  - test
  - build

default:
  tags:
    - homelab
    - docker

validate-python:
  stage: validate
  image: python:3.12-slim

  script:
    - echo "Validating Python application"
    - python --version
    - python -m compileall app

unit-tests:
  stage: test
  image: python:3.12-slim

  before_script:
    - python -m pip install --upgrade pip
    - pip install -r app/requirements.txt
    - pip install pytest

  script:
    - python -m pytest -v

build-image:
  stage: build

  image: docker:cli

  services:
    - name: docker:dind-rootless
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" |
      docker login
      --username "$CI_REGISTRY_USER"
      --password-stdin
      "$CI_REGISTRY"

  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
